# Example: render sigil cards as static SVGs committed to your profile repo.
# Copy this to .github/workflows/sigil.yml in your <username>/<username> repo.
#
# Zero external runtime at render time — the cards are generated here in CI and
# committed as files, so they can never break (no live service to rate-limit or
# go down). Trade-off: they refresh on the schedule below, not on every view.

name: sigil cards

on:
  schedule:
    - cron: '0 */12 * * *' # twice a day
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write # to commit the generated SVGs

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull the sigil renderer. Pin to a tag/SHA in real use.
      - name: Fetch sigil
        run: git clone --depth 1 https://github.com/Mu-iq/sigil.git .sigil

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: cd .sigil && npm i --no-audit --no-fund

      - name: Render cards
        working-directory: .sigil
        env:
          # A GitHub token. The default GITHUB_TOKEN works for public stats;
          # use a PAT with `repo` scope for private contribution counts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGIL_USERNAME: ${{ github.repository_owner }}
          SIGIL_THEME: tokyonight
          SIGIL_CARDS: stats,languages,streak,activity
          SIGIL_OUT: ${{ github.workspace }}/sigil
        run: npx tsx action/render.ts

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sigil/*.svg
          git commit -m "chore: refresh sigil cards" || echo "no changes"
          git push
